services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: bejir-api
    ports:
      - "8000:8000"
    volumes:
      - ./apps/api:/app
    environment:
      ENVIRONMENT: development
      DATABASE_URL: postgresql+psycopg://bejir:bejir123@db:5432/bejir
    depends_on:
      db:
        condition: service_healthy

  db:
    image: pgrouting/pgrouting:17-3.5-3.8
    container_name: bejir-db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bejir}
      POSTGRES_USER: ${POSTGRES_USER:-bejir}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-bejir123}
    ports:
      - "5432:5432"
    volumes:
      - bejir_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bejir -d bejir"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  bejir_postgres_data:
